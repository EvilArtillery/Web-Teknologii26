<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="reset.css">
</head>
<body>


    <header class="header">
        <nav>
            <ul class="ul-nav-flex">
                <li class="list-item">
                    <a href="index.html"><img src="images/DnD-Emblem.png" alt="Loho" width="160" height="90"></a>
                </li>
                <li class="list-item"><a href="O sebe.html">O sebe</a></li>
                <li class="list-item">
                    <a href="">Competensii</a>
                </li>
                <li class="list-item"><a href="">Portfolio</a></li>
                <li class="list-item"><a href="form.html">Kontakti</a></li>
            </ul>
        </nav>
    </header>

    <form class="form">
        <div class="flex-input-text">
            <label for="name">
                <div>Name:</div>
                <div><input type="text" name="name" id="name" pattern="[A-z]+" class="inputOrange"></div>
            </label>
        </div>
        <div class="flex-input-text">
            <label for="email">E-Mail:</label>
            <input type="email" name="email" id="email" class="inputOrange">
        </div>
        <div>
            <label for="theme">What are you asking about?</label><br>
            <select name="theme" id="theme" class="droplistOrange">
                <option value="work">Robota</option>
                <option value="coop">Up to 4 players in a Co-Op PvE experience</option>
                <option value="no_work">Ne robota (veselie)</option>
            </select>
        </div>
        <div>
            <div>How would you prefer for us to reach back to you?</div>
            <label for="rpl_mail"><input type="radio" name="rpl" id="rpl_mail"> Via mail</label>
            <br>
            <label for="rpl_phone"><input type="radio" name="rpl" id="rpl_phone"> Via phone</label>
            <br>
            <label for="rpl_none"><input type="radio" name="rpl" id="rpl_none"> Don't reach back</label>
        </div>
        <div>
            <div>One last question</div>
            <label for="chb1"><input type="checkbox" name="chb1" id="chb1">pancakes</label>
            <br>
            <label for="chb2"><input type="checkbox" name="chb2" id="chb2">waffles</label>
        </div>
        <div>
            <label for="more">More Voprosii, Comrade?</label><br>
            <textarea name="more" id="free_type" cols="40" rows="10" style="border: 2px solid black"></textarea>
        </div>
        <div><input type="submit" value="send" class="buttonOrange"></div>
    </form>
    <footer class="footer">
        Сайт разработан ООО Челики 2026 все райтс ресервд
        <img src="images/2XQh0BX_LVs1.jpg" alt="Sots seti" width="100">
    </footer>
</body>
</html>
